name: Business integration checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  canvas-business-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Pure model/lifecycle tests; no ComfyUI server, credentials or paid calls.
      - name: Table, LLM and generation integration models
        run: >-
          node --test tests/table*.test.mjs tests/llm*.test.mjs
          tests/libtv*.test.mjs tests/dynamic_widget_lifecycle.test.mjs
          tests/app_mode_bypass_model.test.mjs tests/task_snapshots.test.mjs
      - name: Mocked generation bridge and table backend
        run: python -m unittest tests.test_libtv_bridge tests.test_table_generation
      - name: Python source syntax
        run: python -m compileall -q nodes __init__.py
